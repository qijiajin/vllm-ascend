name: Resolve PR 15510 conflicts once

on:
  push:
    branches:
      - codex/resubmit-15253-main-resolved

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reapply PR 15510 on latest upstream main
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/resolve_pr_15510.py /tmp/resolve_pr_15510.py
          git config user.name "qijiajin"
          git config user.email "qijiajin1@huawei.com"
          git remote add upstream https://github.com/vllm-project/vllm-ascend.git || true
          git fetch upstream main
          git checkout -B resolve-work upstream/main
          python3 /tmp/resolve_pr_15510.py
          python3 -m compileall -q vllm_ascend/worker/model_runner_v1.py vllm_ascend/_310p/model_runner_310p.py
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 3
          git diff --name-only | grep -Fx "tests/ut/worker/test_model_runner_v1.py"
          git diff --name-only | grep -Fx "vllm_ascend/_310p/model_runner_310p.py"
          git diff --name-only | grep -Fx "vllm_ascend/worker/model_runner_v1.py"
          git add tests/ut/worker/test_model_runner_v1.py vllm_ascend/_310p/model_runner_310p.py vllm_ascend/worker/model_runner_v1.py
          git commit -s -m "fix(gdn): rebase idle dummy state fix onto current main"
          git push origin HEAD:codex/resubmit-15253-main --force
